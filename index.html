<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' data: https://fonts.gstatic.com https://cdn.jsdelivr.net; img-src 'self' data:; connect-src 'self' https://docs.google.com https://*.googleusercontent.com; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>카페 공명 대시보드</title>
<meta name="description" content="카페사업팀 실적·손익·운영 대시보드 (사내 전용)">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0F1620">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
<style>
:root{
  /* 콘텐츠사업본부 대시보드와 같은 토큰 — 쿨 뉴트럴 + 인디고 */
  --bg:#F5F7FA; --surface:#FFFFFF; --surface2:#F9FAFC; --surface3:#F0F3F7;
  --border:#E4E8EE; --border2:#CDD4DE;
  --ink:#0F1620; --ink1:#232C38; --ink2:#55606E; --ink3:#7C8794; --ink4:#A3ADB9; --ink5:#E9EDF2;
  --accent:#3A5BD9; --accent-deep:#2A44A8; --accent-dim:#EEF1FE; --accent-on-dark:#8AA0EE;
  --good:#0E6E52; --good-dim:#E8F3EF; --warn:#8A5A00; --warn-dim:#FBF1E3; --bad:#B3243C; --bad-dim:#FCECEF;
  --lock-bg:#131A24; --lock-surf:#1B2430; --lock-border:#2A3644;
  --band-bg:#1C2745; --band-top:#223054; --band-border:#2E3D63; --band-ink:#FFFFFF; --band-ink2:#A8B4CE; --band-ink3:#8593B2;
  /* 지점 색 — 순서 고정(검증 통과), 지점을 따라다님 */
  --c-yn:#3A5BD9; --c-hd:#EB6834; --c-mw:#1BAF7A; --c-mg:#EDA100; --c-ss:#E87BA4; --c-dmc:#008300; --c-hj:#4A3AA7;
  --grid:#E9EDF2; --axis:#CDD4DE;
  --r:8px; --r2:6px; --r3:4px; --r4:3px; --rp:999px;
  --sh-sm:0 1px 1px rgba(15,22,32,.04);
  --sh-md:0 1px 2px rgba(15,22,32,.06),0 4px 12px rgba(15,22,32,.05);
  --sh-lg:0 4px 14px rgba(15,22,32,.10),0 16px 36px rgba(15,22,32,.08);
  --sans:'Pretendard','Noto Sans KR',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;
  --hdr-h:56px; --tab-h:44px;
  --ease:cubic-bezier(.16,1,.3,1); --d-fast:140ms; --d-mid:280ms;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;font-family:var(--sans);color:var(--ink);font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased;letter-spacing:-.003em}
button{font-family:var(--sans)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@keyframes riseIn{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* LOCK */
#lock{position:fixed;inset:0;z-index:2000;background:var(--lock-bg);display:flex;align-items:center;justify-content:center;padding:24px 16px}
#lock[hidden]{display:none!important}
.lk-wrap{display:flex;flex-direction:column;align-items:center;gap:24px;width:100%;max-width:400px}
.lk-card{background:var(--lock-surf);border:1px solid var(--lock-border);border-radius:var(--r);padding:40px 40px 36px;width:100%;display:flex;flex-direction:column;gap:14px;box-shadow:0 24px 80px rgba(0,0,0,.5)}
.lk-title{font-size:22px;font-weight:900;color:#fff;letter-spacing:-.03em;line-height:1.25}
.lk-sub{font-size:12px;color:#8B97A6;margin-top:-4px}
.lk-inp{background:#0F1620;border:1.5px solid #2A3644;border-radius:var(--r2);padding:13px 15px;font-size:15px;color:#fff;font-family:var(--sans);outline:none;letter-spacing:.06em}
.lk-inp:focus{border-color:var(--accent)}
.lk-inp::placeholder{color:#69747F;letter-spacing:0}
.lk-btn{background:var(--accent);border:none;border-radius:var(--r2);padding:12px;font-size:13px;font-weight:800;color:#fff;cursor:pointer}
.lk-btn:hover{opacity:.9}
.lk-err{font-size:12px;color:#F08098;font-weight:600;text-align:center;min-height:18px}
.lk-btn:disabled{opacity:.6;cursor:progress}
.lk-rem{display:flex;align-items:center;gap:7px;font-size:12px;color:#B7C1CD;cursor:pointer;user-select:none;margin-top:-2px}
.lk-rem input{width:15px;height:15px;accent-color:var(--accent);margin:0}
.lk-rem span{color:#69747F}
.lk-admin{font-size:11.5px;color:#69747F;text-decoration:none}
.lk-admin:hover{color:#B7C1CD;text-decoration:underline}
.lk-admin[hidden]{display:none}

/* SETUP (배포판 초기 설정) */
#setup{min-height:100vh;background:var(--bg)}
#setup[hidden]{display:none!important}
.su{max-width:860px;margin:0 auto;padding:28px 20px 60px}
.su-top{display:flex;align-items:flex-end;gap:10px;margin-bottom:22px}
.su-top img{height:36px;width:auto;display:block}
.su-top span{font-size:12.5px;font-weight:700;color:var(--ink2);padding-bottom:2px}
.su h1{font-size:26px;font-weight:900;letter-spacing:-.03em;margin:0 0 6px}
.su-lead{font-size:13.5px;color:var(--ink2);margin:0 0 18px;line-height:1.65}
.su-card{margin-bottom:12px}
.su-h{display:flex;align-items:center;gap:9px;font-size:14.5px;font-weight:800;color:var(--ink);margin-bottom:12px}
.su-h small{font-size:11.5px;font-weight:600;color:var(--ink3)}
.su-n{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:var(--ink);color:#fff;font-size:12px;font-weight:800;flex-shrink:0}
.su-f,.su-row{display:grid;grid-template-columns:120px minmax(0,1fr) 150px;align-items:center;gap:10px;margin-bottom:8px}
.su-row{grid-template-columns:150px minmax(0,1fr) 150px;margin-bottom:6px}
.su-f label{font-size:12.5px;font-weight:700;color:var(--ink1)}
.su-row label{font-size:12px;font-weight:700;color:var(--ink1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.su-in{width:100%;background:var(--surface);border:1px solid var(--border2);border-radius:var(--r3);padding:8px 10px;font-size:12.5px;font-family:var(--sans);color:var(--ink);outline:none}
.su-in:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-dim)}
.su-st{font-size:11.5px;font-weight:600;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.su-st.good{color:var(--good)}.su-st.bad{color:var(--bad)}.su-st.warn{color:var(--warn)}
.su-tabs{border-top:1px solid var(--border);padding-top:10px;margin-top:12px}
.su-tabs summary{cursor:pointer;font-size:13px;font-weight:800;color:var(--ink);margin-bottom:10px;list-style-position:inside}
.su-tabs summary small{font-weight:600;color:var(--ink3);margin-left:4px}
.su-act{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0 14px}
.su-go{background:var(--accent);border:none;border-radius:var(--r2);padding:8px 16px;font-size:13px;font-weight:800;color:#fff;cursor:pointer}
.su-go:hover{background:var(--accent-deep)}
.su-go:disabled,.su .hbtn:disabled{opacity:.6;cursor:progress}
.su .hbtn{padding:7px 14px;font-size:13px}
.su-msg{font-size:12.5px;font-weight:700;color:var(--ink2)}
.su-msg.good{color:var(--good)}.su-msg.bad{color:var(--bad)}
.su-code{width:100%;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;line-height:1.5;background:var(--surface3);border:1px solid var(--border2);border-radius:var(--r3);padding:10px;color:var(--ink);resize:vertical;word-break:break-all}
.su-steps{margin:4px 0 0;padding-left:20px;font-size:12.5px;color:var(--ink2);line-height:1.8}
.su-done{border-color:var(--accent)}
.su-foot{margin-top:20px;font-size:12.5px}
.su-foot a{color:var(--accent);font-weight:700;text-decoration:none}
kbd{font-family:var(--sans);font-size:11px;font-weight:700;border:1px solid var(--border2);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--surface)}
.errlist{margin:10px 0 0;padding-left:18px;font-size:12px;color:var(--bad);line-height:1.7}
@media (max-width:640px){
  .su{padding:20px 16px 48px}
  .su-f,.su-row{grid-template-columns:minmax(0,1fr);gap:4px;margin-bottom:12px}
  .su h1{font-size:22px}
}

/* APP */
#app{display:flex;flex-direction:column;min-height:100vh}
#app[hidden]{display:none!important}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:100;height:var(--hdr-h);background:rgba(245,247,250,.9);backdrop-filter:blur(16px) saturate(180%);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--border)}
.hdr{display:flex;align-items:center;gap:14px;height:100%;padding:0 24px}
.brand{display:flex;align-items:flex-end;gap:8px;min-width:0}
.brand img{height:40px;width:auto;display:block}
.brand-t{color:var(--ink);font-size:13px;font-weight:700;letter-spacing:-.01em;padding-bottom:2px;white-space:nowrap}
.conf-badge{display:inline-flex;align-items:center;height:17px;padding:0 6px;border-radius:var(--r4);background:var(--accent-dim);border:1px solid var(--accent);color:var(--ink);font-size:9px;font-weight:800;letter-spacing:.08em;white-space:nowrap;margin-bottom:3px}
.hdr-r{margin-left:auto;display:flex;align-items:center;gap:10px}
.sync-st{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink3);font-weight:500;white-space:nowrap}
.sync-dot{width:6px;height:6px;border-radius:50%;background:var(--good);flex-shrink:0}
.sync-dot.loading{background:var(--accent);animation:blink .9s linear infinite}
.sync-dot.snap{background:var(--warn)}
.sync-dot.error{background:var(--bad)}
.mpick{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink2);white-space:nowrap}
.mpick select,.sel{background:var(--surface);border:1px solid var(--border2);border-radius:var(--r3);padding:5px 9px;color:var(--ink);font-family:var(--sans);font-size:12px;outline:none;cursor:pointer}
.hbtn{background:var(--surface);border:1px solid var(--border2);color:var(--ink2);border-radius:var(--r2);padding:5px 10px;cursor:pointer;font-size:12px;font-weight:600;white-space:nowrap}
.hbtn:hover{border-color:var(--ink3);color:var(--ink)}

.tabs-bar{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hdr-h));z-index:99;height:var(--tab-h);background:rgba(245,247,250,.9);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;overflow-x:auto;scrollbar-width:none}
.tabs-bar::-webkit-scrollbar{display:none}
.tab-btn{border:none;background:none;color:var(--ink3);padding:0 14px;height:44px;font-size:13px;font-weight:700;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;display:flex;align-items:center;gap:5px;transition:color var(--d-fast) linear,border-color var(--d-fast) linear}
.tab-btn:hover{color:var(--ink)}
.tab-btn.active{color:var(--ink);border-bottom-color:var(--accent);font-weight:900}
.tab-btn .cnt{font-size:10px;font-weight:800;color:#fff;background:var(--bad);border-radius:var(--rp);padding:0 5px;line-height:15px}
.tab-div{width:1px;height:18px;background:var(--border);margin:0 6px;flex-shrink:0}

.pill-bar-wrap{background:linear-gradient(180deg,var(--band-top),var(--band-bg));border-bottom:1px solid var(--band-border)}
.pill-bar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));min-height:128px}
.pill{display:flex;flex-direction:column;justify-content:space-between;padding:19px 28px;position:relative;min-width:0}
.pill:not(:last-child){box-shadow:inset -1px 0 0 var(--band-border)}
.pill-lbl{font-size:10px;color:var(--band-ink3);font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.pill-val{font-size:42px;font-weight:800;color:var(--band-ink);letter-spacing:-.04em;line-height:1;text-align:right;margin-top:auto;white-space:nowrap}
.pill-val small{font-size:.5em;font-weight:700;letter-spacing:0;margin-left:2px}
.pill-val.up{color:var(--accent-on-dark)} .pill-val.dn{color:#F08098}
.pill-sub{font-size:12px;color:var(--band-ink2);text-align:right;margin-top:8px}
.pill-meter{height:3px;border-radius:2px;background:rgba(255,255,255,.12);margin-top:10px;overflow:hidden}
.pill-meter i{display:block;height:3px;background:var(--accent-on-dark);border-radius:2px}

main{flex:1;padding:18px 24px 80px;width:100%;max-width:1480px;margin:0 auto}
.section{display:none}
.section.active{display:block;animation:riseIn var(--d-mid) var(--ease) both}
.sec-label{font-size:11px;font-weight:800;color:var(--ink3);letter-spacing:.08em;text-transform:uppercase;margin:26px 0 10px;display:flex;align-items:center;gap:8px}
.sec-label:first-child{margin-top:4px}
.sec-label::after{content:'';flex:1;height:1px;background:var(--border)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:20px 22px;box-shadow:var(--sh-sm);min-width:0}
.card-title{font-size:14px;font-weight:800;color:var(--ink);margin-bottom:12px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;letter-spacing:-.005em}
.card-title small{font-size:11px;color:var(--ink3);font-weight:500}
.card-title .r{margin-left:auto;display:flex;gap:6px;align-items:center}
.g2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:12px}
.g2e{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.gap{margin-top:12px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:18px 20px;box-shadow:var(--sh-sm);min-width:0}
.kpi-lbl{font-size:11px;color:var(--ink3);font-weight:700;letter-spacing:.06em;margin-bottom:8px}
.kpi-val{font-size:28px;font-weight:800;color:var(--ink);letter-spacing:-.04em;line-height:1.05;margin-bottom:6px;white-space:nowrap}
.kpi-val small{font-size:15px;font-weight:700;letter-spacing:0;margin-left:2px}
.kpi-sub{font-size:12px;color:var(--ink3);line-height:1.5}
.kpi-sub b{color:var(--ink2)}
.up{color:var(--good)} .dn{color:var(--bad)}

/* 표 */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-size:11px;font-weight:700;color:var(--ink3);text-align:left;padding:8px 10px;border-bottom:1px solid var(--border2);white-space:nowrap;background:var(--surface);position:sticky;top:0}
td{font-size:12.5px;padding:8px 10px;border-bottom:1px solid var(--border);color:var(--ink1);vertical-align:middle}
td.n,th.n{text-align:right;white-space:nowrap}
.tbl-wrap td:first-child{white-space:nowrap}
tr:hover td{background:var(--surface2)}
tr.tot td{font-weight:800;color:var(--ink);background:var(--surface2);border-top:1px solid var(--border2)}
tr.sub td{color:var(--ink2);font-size:12px}
tr.sub td:first-child{padding-left:22px}
tr.grp td{font-weight:800;color:var(--ink)}
td .sm{display:block;font-size:10.5px;color:var(--ink3);font-weight:600;line-height:1.2}
td.muted,.muted{color:var(--ink3)}
.dot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:7px;vertical-align:0}
.badge{display:inline-flex;align-items:center;gap:4px;border-radius:var(--r4);padding:2px 7px;font-size:11px;font-weight:800;white-space:nowrap;line-height:1.5}
.badge.good{background:var(--good-dim);color:var(--good)}
.badge.warn{background:var(--warn-dim);color:var(--warn)}
.badge.bad{background:var(--bad-dim);color:var(--bad)}
.badge.info,.badge.neutral{background:var(--surface3);color:var(--ink2)}
.badge.acc{background:var(--accent-dim);color:var(--accent-deep)}
.inbar{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.inbar i{display:block;height:6px;border-radius:0 3px 3px 0;background:var(--accent);min-width:1px}
.inbar.neg i{background:var(--bad)}

/* 칩 필터 */
.filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.chip{border:1px solid var(--border2);background:var(--surface);color:var(--ink2);border-radius:var(--rp);padding:5px 12px;font-size:12px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip:hover{border-color:var(--ink3)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip .dot{margin-right:0}
.seg{display:inline-flex;border:1px solid var(--border2);border-radius:var(--r3);overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;font-size:12px;font-weight:700;color:var(--ink3);padding:6px 11px;cursor:pointer}
.seg button.on{background:var(--ink);color:#fff}
.search{border:1px solid var(--border2);border-radius:var(--r3);padding:6px 10px;font-size:12px;font-family:var(--sans);min-width:0;width:200px;outline:none}
.search:focus{border-color:var(--accent)}

/* 알림 */
.notice{display:flex;gap:10px;align-items:flex-start;background:var(--warn-dim);border:1px solid #EFD9B4;color:var(--warn);border-radius:var(--r2);padding:10px 14px;font-size:12.5px;line-height:1.6;margin-bottom:12px}
.notice.info{background:var(--accent-dim);border-color:#D5DDFA;color:var(--accent-deep)}
.notice b{font-weight:800}
.alerts{display:flex;flex-direction:column}
.alert{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:12px;align-items:start;padding:11px 2px;border-bottom:1px solid var(--border)}
.alert:last-child{border-bottom:0}
.alert .t{font-size:13px;font-weight:700;color:var(--ink);line-height:1.45}
.alert .d{font-size:12px;color:var(--ink3);margin-top:2px;line-height:1.55}
.alert button{border:1px solid var(--border2);background:var(--surface);border-radius:var(--r3);font-size:11px;font-weight:700;color:var(--ink2);padding:4px 8px;cursor:pointer;white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:11.5px;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px}
.legend i.ln{height:2px;width:14px;border-radius:1px}
.note{font-size:11.5px;color:var(--ink3);line-height:1.65;margin-top:10px}
.note b{color:var(--ink2)}

/* 차트 */
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{font-family:var(--sans);font-size:11px;fill:var(--ink3)}
.chart .lbl{fill:var(--ink2);font-weight:700}
.chart .hit{fill:transparent;cursor:crosshair}
.chart .bar{transition:opacity var(--d-fast) linear}
.chart.hov .bar{opacity:.55}
.chart.hov .bar.on{opacity:1}
#tip{position:fixed;z-index:3000;pointer-events:none;background:var(--ink);color:#fff;border-radius:var(--r2);padding:9px 11px;font-size:12px;line-height:1.55;box-shadow:var(--sh-lg);max-width:300px;opacity:0;transition:opacity 80ms linear}
#tip.on{opacity:1}
#tip .tt{font-size:11px;color:#A8B4CE;font-weight:700;margin-bottom:4px}
#tip .row{display:flex;align-items:center;gap:8px;justify-content:space-between}
#tip .row span{display:inline-flex;align-items:center;gap:6px;color:#C6CEDC}
#tip .row b{font-weight:800;color:#fff;font-variant-numeric:tabular-nums}
#tip .row i{display:inline-block;width:10px;height:2px;border-radius:1px}

/* 폭포 · 진행 막대 */
.hb{display:grid;grid-template-columns:minmax(80px,120px) minmax(0,1fr) auto;gap:10px;align-items:center;padding:5px 0}
.hb .l{font-size:12px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb .b{height:10px;background:var(--surface3);border-radius:0 3px 3px 0;overflow:hidden}
.hb .b i{display:block;height:10px;border-radius:0 3px 3px 0}
.hb .v{font-size:12px;font-weight:800;color:var(--ink);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.hb .v small{font-weight:600;color:var(--ink3);margin-left:4px}

/* 퍼널 */
.funnel{display:flex;gap:6px;flex-wrap:wrap}
.fs{flex:1;min-width:92px;text-align:left;border:1px solid var(--border);background:var(--surface);border-radius:var(--r3);padding:10px 11px 9px;cursor:pointer;position:relative;overflow:hidden}
.fs:hover{border-color:var(--border2)}
.fs.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-dim)}
.fs b{display:block;font-size:22px;font-weight:800;letter-spacing:-.03em;color:var(--ink);line-height:1}
.fs span{display:block;font-size:11px;color:var(--ink3);margin-top:5px}
.fs i{position:absolute;left:0;bottom:0;height:3px;background:var(--accent);display:block}
.fs.drop i{background:var(--ink4)}

/* 가이드 */
.rule td{vertical-align:top;line-height:1.7;font-size:12.5px;color:var(--ink2)}
.rule td:first-child{width:26px;color:var(--ink3);font-weight:800}
.flow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.flow .card h4{margin:0 0 8px;font-size:13px;font-weight:800;color:var(--ink)}
.flow .card h4 span{font-size:11px;font-weight:700;color:var(--accent-deep);background:var(--accent-dim);border-radius:var(--r4);padding:2px 7px;margin-left:6px}
.flow ul{margin:0;padding-left:16px;color:var(--ink2);font-size:12.5px;line-height:1.75}
.flow li b{color:var(--ink)}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;background:var(--surface3);padding:1px 5px;border-radius:3px;color:var(--ink1)}
details.cols{border:1px solid var(--border);border-radius:var(--r2);background:var(--surface);margin-bottom:8px}
details.cols summary{cursor:pointer;padding:11px 14px;font-weight:800;font-size:13px;display:flex;gap:10px;align-items:baseline;list-style:none}
details.cols summary::-webkit-details-marker{display:none}
details.cols summary::before{content:'›';color:var(--ink3);font-weight:800;transition:transform var(--d-fast) linear;display:inline-block}
details.cols[open] summary::before{transform:rotate(90deg)}
details.cols summary small{font-weight:500;color:var(--ink3);font-size:11.5px}
details.cols .in{padding:0 14px 12px}
.sevrow td:first-child{width:74px}
.empty{padding:28px 10px;text-align:center;color:var(--ink3);font-size:12.5px}
.conf-note{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:28px;padding:12px 2px 0;border-top:1px solid var(--border);font-size:11px;color:var(--ink3);line-height:1.6}
.conf-note b{color:var(--ink2)}
.conf-note .stamp{margin-left:auto}

@media (max-width:1100px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .flow{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pill-val{font-size:34px}
}
@media (max-width:820px){
  .hdr{padding:0 16px;gap:10px}
  .brand-t,.sync-st span,.hide-m{display:none}
  main{padding:14px 16px 60px}
  .g2,.g2e,.g3{grid-template-columns:minmax(0,1fr)}
  .pill-bar{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pill{padding:16px 16px}
  .pill:nth-child(2){box-shadow:none}
  .pill:nth-child(-n+2){border-bottom:1px solid var(--band-border)}
  .pill-val{font-size:28px}
  .card{padding:16px}
  .kpi-val{font-size:24px}
  .alert{grid-template-columns:56px minmax(0,1fr)}
  .alert button{grid-column:2;justify-self:start}
}
@media (max-width:560px){
  .g4,.flow{grid-template-columns:minmax(0,1fr)}
  td,th{padding:7px 8px}
  .tab-btn{font-size:12px;padding:0 10px}
  .search{width:100%}
}

</style>
